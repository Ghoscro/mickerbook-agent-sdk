name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --no-bin-links
      - run: npm run qa

  npm:
    if: vars.PUBLISH_NPM == 'true' && startsWith(github.event.release.tag_name, 'v')
    needs: qa
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pack and verify installable CLI
        working-directory: packages/js
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          artifact="$RUNNER_TEMP/mickerbook-sdk-js-$(node -p "require('./package.json').version").tgz"
          npm install --prefix "$RUNNER_TEMP/sdk-smoke" --ignore-scripts --no-audit --no-fund "$artifact"
          "$RUNNER_TEMP/sdk-smoke/node_modules/.bin/micker" --version
          echo "SDK_TARBALL=$artifact" >> "$GITHUB_ENV"
      - name: Publish verified tarball
        run: npm publish "$SDK_TARBALL" --access public --provenance --tag latest

  pypi:
    if: vars.PUBLISH_PYPI == 'true' && startsWith(github.event.release.tag_name, 'v')
    needs: qa
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build packages/python --outdir packages/python/dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
